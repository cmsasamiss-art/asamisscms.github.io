function sliderHTML(ids,key){
 if(!ids.length)return `<div class="ph">${t("empty")}</div>`;
 const im=ids.map(i=>`<img src="${url(i)}" alt="" loading="lazy">`).join("");
 const rep=ids.length<4?Math.ceil(8/ids.length):2;
 const half=Array(Math.max(1,Math.ceil(rep/2))).fill(im).join("");
 return `<div class="track" style="--d:${Math.max(15,ids.length*7)}s">${half}${half}</div>`}
function renderGal(){$("#gal").innerHTML=cfg.gal.length?`<div class="gg">${cfg.gal.map(i=>`<img src="${url(i)}" alt="" loading="lazy">`).join("")}</div>`:`<div class="ph">${t("empty")}</div>`}

// commission options
function renderOpts(){
 const box=$("#opts");let h="";
 h+=`<div class="card"><h3>${t("use")}</h3>`+[[false,t("personal")],[true,t("comm")]].map(([v,l])=>`<label class="opt ${sel.comm===v?"sel":""}"><span><input type="radio" name="use" data-use="${v}" ${sel.comm===v?"checked":""}>${l}</span></label>`).join("")+`</div>`;
 ["rc","bw","fr"].forEach(k=>{h+=`<div class="card"><h3>${t("sec")[k]}</h3>${exImg(k)}`+P[k].map((p,i)=>{const on=sel.base&&sel.base.k===k&&sel.base.i===i;return `<label class="opt ${on?"sel":""}"><span><input type="checkbox" data-b="${k}:${i}" ${on?"checked":""}>${t("sz")[i]}</span><b>${money(p)}</b></label>`}).join("")+`</div>`});
 h+=`<div class="card"><h3>${t("sec").ad}</h3>${exImg("ad")}`+P.ad.map((p,i)=>`<label class="opt ${sel.ad.has(i)?"sel":""}"><span><input type="checkbox" data-a="${i}" ${sel.ad.has(i)?"checked":""}>${t("add")[i]}</span><b>${money(p)}</b></label>`).join("")+`</div>`;
 h+=`<div class="card"><h3>${t("chars")}</h3>`+[1,2,3,4].map(n=>`<label class="opt ${sel.chars===n?"sel":""}"><span><input type="radio" name="ch" data-c="${n}" ${sel.chars===n?"checked":""}>${n}${n>1?" (x"+n+")":""}</span></label>`).join("")+`</div>`;
 const sc=[...box.querySelectorAll(".car")].map(c=>c.scrollLeft);box.innerHTML=h;box.querySelectorAll(".car").forEach((c,i)=>c.scrollLeft=sc[i]||0);renderRcpt()}
document.addEventListener("click",e=>{const d=e.target.dataset;if(d&&d.cs){const c=e.target.parentNode.querySelector(".car");c.scrollBy({left:+d.cs*c.clientWidth,behavior:"smooth"})}
 if(e.target.closest&&e.target.closest("#gal")&&e.target.tagName==="IMG"){$("#lbi").src=e.target.src;$("#lb").style.display="flex"}});
function typeIds(k){const v=cfg.types[k];return Array.isArray(v)?v:v?[v]:[]}
function exImg(k){const ids=typeIds(k);return ids.length?`<div class="cw"><div class="car">${ids.map(i=>`<img src="${url(i)}" alt="" loading="lazy">`).join("")}</div>${ids.length>1?'<button class="cb l" data-cs="-1" aria-label="prev">&#8249;</button><button class="cb r" data-cs="1" aria-label="next">&#8250;</button>':""}</div>${ids.length>1?`<div class="note" style="text-align:center;margin-bottom:6px">${t("swipe")}</div>`:""}`:`<div class="exph">${t("img")}</div>`}
$("#opts").addEventListener("change",e=>{const d=e.target.dataset;
 if(d.use!==undefined)sel.comm=d.use==="true";
 if(d.b){const[k,i]=d.b.split(":");sel.base=e.target.checked?{k,i:+i}:null}
 if(d.a!==undefined){e.target.checked?sel.ad.add(+d.a):sel.ad.delete(+d.a)}
 if(d.c)sel.chars=+d.c;
 if(d.up)return;
 renderOpts()});
$("#reset").onclick=()=>{sel={base:null,ad:new Set(),chars:1,comm:false};renderOpts()};
function renderRcpt(){
 const rows=[];let base=0,ad=0;
 if(sel.base){base=P[sel.base.k][sel.base.i];rows.push([t("sec")[sel.base.k]+" · "+t("sz")[sel.base.i]+(sel.chars>1?" x"+sel.chars:""),base*sel.chars])}
 [...sel.ad].sort().forEach(i=>{ad+=P.ad[i];rows.push([t("add")[i],P.ad[i]])});
 if(sel.comm)rows.push([t("comm"),null]);
 const total=(base*sel.chars+ad)*(sel.comm?2:1);
 $("#rcpt").innerHTML=rows.length?rows.map(r=>`<div class="row"><span>${esc(r[0])}</span><span>${r[1]==null?"":money(r[1])}</span></div>`).join(""):`<small>${t("none")}</small>`;
 $("#tot").textContent=money(total)}

 $("#payL").innerHTML=PAY.map(x=>`<span>${esc(x)}</span>`).join("");$("#em").textContent=EMAIL;$("#em").href="mailto:"+EMAIL;

// reviews
$("#st").onclick=e=>{const i=[...$("#st").children].indexOf(e.target);if(i<0)return;star=i+1;[...$("#st").children].forEach((b,j)=>b.classList.toggle("on",j<star))};
$("#ra").onchange=e=>{$("#rn").disabled=e.target.checked};
$("#rf").onchange=async e=>{const f=e.target.files[0];if(!f)return;revFile=await shrink(f,520);$("#rfn").textContent=f.name};
function shrink(f,max){return new Promise(res=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};im.src=URL.createObjectURL(f)})}
$("#rs").onclick=async()=>{
 if(!star){$("#rm").textContent=t("needStar");return}
 const rec={name:$("#ra").checked?"":$("#rn").value.trim(),anon:$("#ra").checked,stars:star,tags:$$("#tags input:checked").map(x=>+x.value),text:$("#rt").value.trim(),av:avSel,img:revFile||"",ts:Date.now()};
 try{if(!db)throw 0;await db.collection("reviews").add(rec);$("#rm").textContent=t("thanks");$("#rt").value="";$("#rn").value="";star=0;revFile=null;$("#rfn").textContent="";$$("#st b").forEach(b=>b.classList.remove("on"));$$("#tags input").forEach(x=>x.checked=false)}
 catch(e){$("#rm").textContent=""+(db?"error":"Please sign in to claude.ai to post")}};

// owner uploads
document.addEventListener("change",e=>{const d=e.target.dataset;if(d&&d.up&&!d.b)upload(e.target,d.up)});
async function upload(inp,key){
 const m=$("#am");let assets=null;try{assets=await claude.use("assets")}catch(e){}
 if(!assets||!db){m.textContent="Upload failed: sign in to claude.ai as the page owner / อัปโหลดไม่สำเร็จ ต้องล็อกอินเจ้าของเพจ";inp.value="";return}
 m.textContent="Uploading...";const ids=[];for(const f of inp.files){try{ids.push((await assets.upload(await shrinkBlob(f))).id)}catch(x){}}
 const n={...cfg,types:{...cfg.types}};
 if(key.startsWith("type:")){const k=key.slice(5);n.types[k]=[...typeIds(k),...ids]}else n[key]=[...(cfg[key]||[]),...ids];
 try{await db.doc("site/config").set(n);m.textContent="Done / เรียบร้อย"}catch(e){m.textContent="Save failed / บันทึกไม่สำเร็จ"}inp.value=""}
function shrinkBlob(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const r=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.85)};im.src=URL.createObjectURL(f)})}
$$("[data-clear]").forEach(b=>b.onclick=async()=>{if(db)await db.doc("site/config").set({...cfg,[b.dataset.clear]:[]})});

const HASH="b928a82160081bea405c201c885032e36ac9ccae771dc65fd37a0d29f96cdabb";
async function sha(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function setAdmin(v){ADMIN=v;owner=v;document.body.classList.toggle("isown",v);$("#login").style.display=v?"none":"";$("#editor").style.display=v?"":"none";try{sessionStorage.setItem("adm",v?"1":"")}catch(e){}if(v)fillAdmin();renderOpts();renderRevs()}
const L=a=>a.join("\n"),lines=x=>x.split("\n").map(v=>v.trim()).filter(Boolean);
function renderAI(){
 const G=[["home","Home slides / สไลด์หน้าแรก"],["rev","Review slides / สไลด์รีวิว"],["gal","Portfolio gallery / ตัวอย่างผลงาน"],...["rc","bw","fr","ad"].map(k=>["type:"+k,"Examples / ตัวอย่าง: "+T.th.sec[k]])];
 $("#ai").innerHTML=G.map(([k,l])=>{const ids=k.startsWith("type:")?typeIds(k.slice(5)):(cfg[k]||[]);return `<div style="margin-bottom:14px"><b>${l}</b><div>${ids.map(i=>`<span class="th"><img src="${url(i)}" alt=""><button data-k="${k}" data-id="${i}">x</button></span>`).join("")}</div><label class="btn sec">+ Add images / เพิ่มรูป<input type="file" accept="image/*" multiple hidden data-up="${k}"></label></div>`}).join("")}
$("#ai").onclick=async e=>{const k=e.target.dataset.k,id=e.target.dataset.id;if(!k||!db)return;const n={...cfg,types:{...cfg.types}};
 if(k.startsWith("type:")){const kk=k.slice(5);n.types[kk]=typeIds(kk).filter(x=>x!==id)}else n[k]=(cfg[k]||[]).filter(x=>x!==id);
 try{await db.doc("site/config").set(n);(await claude.use("assets")).delete(id)}catch(x){$("#am").textContent="Failed / ไม่สำเร็จ"}};
function fillAdmin(){renderAI();
 $("#ae").value=EMAIL;$("#a1").value=L(T.th.tosL);$("#a2").value=L(T.en.tosL);$("#a3").value=L(T.th.stepL);$("#a4").value=L(T.en.stepL);$("#a5").value=L(PAY);
 $("#ap").innerHTML=["rc","bw","fr","ad"].map(k=>`<h3>${T.th.sec[k]}</h3><div class="g">`+P[k].map((p,i)=>`<span>${k==="ad"?T.th.add[i]:T.th.sz[i]}</span><input type="number" min="0" data-pk="${k}:${i}" value="${p}">`).join("")+"</div>").join("")}
$("#adm").onclick=e=>{e.preventDefault();go("admin")};$("#bk").onclick=()=>go("home");

$("#sv").onclick=async()=>{
 const prices={};$$("[data-pk]").forEach(x=>{const[k,i]=x.dataset.pk.split(":");(prices[k]=prices[k]||[])[+i]=Math.max(0,+x.value||0)});
 const content={email:$("#ae").value.trim()||EMAIL,tos_th:lines($("#a1").value),tos_en:lines($("#a2").value),steps_th:lines($("#a3").value),steps_en:lines($("#a4").value),pay:lines($("#a5").value),prices};
 try{if(!db)throw 0;await db.doc("site/config").set({...cfg,content});$("#am").textContent="Saved / บันทึกแล้ว"}catch(e){$("#am").textContent="Save failed: sign in to claude.ai as the page owner / บันทึกไม่สำเร็จ ต้องล็อกอินเจ้าของเพจ"}};
function applyContent(c){
 if(!c)return;
 if(c.email)EMAIL=c.email;if(c.tos_th&&c.tos_th.length)T.th.tosL=c.tos_th;if(c.tos_en&&c.tos_en.length)T.en.tosL=c.tos_en;
 if(c.steps_th&&c.steps_th.length)T.th.stepL=c.steps_th;if(c.steps_en&&c.steps_en.length)T.en.stepL=c.steps_en;
 if(c.pay&&c.pay.length)PAY.splice(0,PAY.length,...c.pay);
 if(c.prices)for(const k in P)if(Array.isArray(c.prices[k])&&c.prices[k].length===P[k].length)P[k]=c.prices[k].map(Number)}

// live data
(async()=>{
 try{db=await claude.use("db")}catch(e){}
 
 if(!db){return}
 db.doc("site/config").onSnapshot(s=>{const d=s.exists?s.data():{};cfg={home:d.home||[],rev:d.rev||[],gal:d.gal||[],types:d.types||{},content:d.content};applyContent(d.content);renderText();renderSliders();renderOpts();if(ADMIN){renderAI();if(!document.activeElement.closest("#editor"))fillAdmin()}},()=>{});
 db.collection("reviews").orderBy("ts","desc").limit(100).onSnapshot(s=>{revs=s.docs.map(d=>({id:d.id,...d.data()}));renderRevs()},()=>{});
})();
